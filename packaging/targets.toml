# CLROOM target matrix.
# The build lane is integrity-verified; real-provider qualification is a
# separate evidence-bound release gate.
# Unsupported and missing-runner fixtures remain excluded from release claims.
schema_version = "clroom.packaging-targets.v2"
advertised_targets = ["alpha-macos-aarch64"]
qualified_targets = ["alpha-macos-aarch64"]
claims_policy = "advertised targets exactly equal qualified build/test lanes"

# Matrix fixtures are data, not release claims. Unsupported and missing-runner
# lanes must be excluded from claims (never silently skipped).
fixture_supported = "alpha-macos-aarch64"
fixture_unsupported = "unsupported-linux-riscv64"
fixture_missing_runner = "missing-runner-windows-aarch64"
fixture_disposition = "unsupported targets are excluded"
target_entry_policy = "CI selects only names listed in qualified_targets and verifies qualification_status"

[[targets]]
name = "alpha-macos-aarch64"
rust_target = "aarch64-apple-darwin"
runner = "macos-15"
qualification_status = "INTEGRITY_VERIFIED"
artifact_name = "clean-room-launcher-v0.4.0-aarch64-apple-darwin"
required_checks = "fmt, clippy, test, schema, target-matrix"
signing_policy = "unsigned"

[[targets]]
name = "fixture_unsupported"
rust_target = "riscv64gc-unknown-linux-gnu"
runner = "unsupported"
qualification_status = "NOT_QUALIFIED"
artifact_name = ""
required_checks = "fmt, clippy, test, schema, target-matrix"
signing_policy = "none"

[[targets]]
name = "fixture_missing_runner"
rust_target = "aarch64-pc-windows-msvc"
runner = "missing-runner"
qualification_status = "NOT_QUALIFIED"
artifact_name = ""
required_checks = "fmt, clippy, test, schema, target-matrix"
signing_policy = "none"
