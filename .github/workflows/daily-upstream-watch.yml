name: Daily upstream source watch (advisory)
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/probe/watch-agent-ecosystem.py'
      - 'scripts/probe/watch-security-advisories.py'
      - '.github/workflows/daily-upstream-watch.yml'

permissions:
  contents: read

concurrency:
  group: daily-upstream-watch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  watch:
    name: Read-only provider and standards source signals
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      WATCH_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Negative and offline contract tests
        run: python3 scripts/probe/watch-agent-ecosystem.py --self-test
      - name: Rehearse exact-source public API inputs (same path used by daily schedule)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/probe/watch-agent-ecosystem.py --output "$RUNNER_TEMP/compatibility-watch.json"
      - name: Prove PR input coverage and exact source binding
        if: github.event_name == 'pull_request'
        run: |
          python3 - "$RUNNER_TEMP/compatibility-watch.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text())
          assert report["source_commit"] == os.environ["WATCH_SOURCE_HEAD"]
          assert len(report["signals"]) == 5
          unknown = [signal["source"] + ":" + signal.get("reason", "no-reason") for signal in report["signals"] if signal["state"] == "UNKNOWN"]
          print("DAILY_WATCH_UNKNOWN_SOURCES=" + ",".join(unknown))
          assert not unknown, "unknown external source evidence"
          assert report["release_decision"] == "NOT_AUTHORIZED"
          print("DAILY_WATCH_SOURCE_REHEARSAL_PASS")
          PY
      - name: Test security-advisory intake (offline negative fixtures)
        run: python3 scripts/probe/watch-security-advisories.py --self-test
      - name: Read public GHSA + CISA KEV advisories (no writes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/probe/watch-security-advisories.py --output "$RUNNER_TEMP/security-advisory-evidence.json"
      - name: Rehearse exact-source advisory coverage
        if: github.event_name == 'pull_request'
        run: |
          python3 - "$RUNNER_TEMP/security-advisory-evidence.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          result = json.loads(Path(sys.argv[1]).read_text())
          assert result["schema"] == "clroom.advisory-intake.v1"
          assert result["source_commit"] == os.environ["WATCH_SOURCE_HEAD"]
          assert len(result["coverage"]) == 4
          unknown = [f"{key}:{state}" for key,state in result["coverage"].items() if state.startswith("UNKNOWN")]
          print("ADVISORY_UNKNOWN_FEEDS=" + ",".join(unknown))
          assert not unknown, "advisory source input not observed on exact PR HEAD"
          assert result["release_decision"] == "NOT_AUTHORIZED"
          print("ADVISORY_EVIDENCE_REHEARSAL_PASS")
          PY
      - name: Preserve reviewable exact-run signal artifact
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daily-upstream-watch-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/compatibility-watch.json
            ${{ runner.temp }}/security-advisory-evidence.json
          if-no-files-found: error
          retention-days: 30
