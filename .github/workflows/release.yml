name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate tag and resolve accepted pre-tag stage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      artifact_name: ${{ steps.release.outputs.artifact_name }}
    steps:
      - name: Check out exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reconcile immutable tag identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          test "$(git cat-file -t "refs/tags/$tag")" = tag
          test "$(git rev-parse "refs/tags/$tag^{}")" = "$GITHUB_SHA"
          test "$(git for-each-ref --format='%(contents:subject)' "refs/tags/$tag")" = "$tag — Clean Room Launcher"

          manifest_version="$(python3 - <<'PY'
          import tomllib
          with open("Cargo.toml", "rb") as handle:
              print(tomllib.load(handle)["package"]["version"])
          PY
          )"
          test "$manifest_version" = "$version"
          test "$tag" = "v$manifest_version"

          prerelease=false
          case "$version" in *-rc.*) prerelease=true ;; esac
          artifact_name="clean-room-launcher-v${version}-aarch64-apple-darwin.tar.gz"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
      - name: Resolve exact accepted pre-tag stage
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/release/resolve-pretag-stage.sh             "${{ steps.release.outputs.version }}"             "$GITHUB_SHA"             "$RUNNER_TEMP/release-stage"
      - name: Upload immutable promotion input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-stage-v${{ steps.release.outputs.version }}-${{ github.sha }}
          path: ${{ runner.temp }}/release-stage/*
          if-no-files-found: error
          retention-days: 7

  attest:
    name: Bind accepted staged bytes to exact tag
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download accepted staged bytes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-stage-v${{ needs.prepare.outputs.version }}-${{ github.sha }}
          path: release-stage
      - name: Verify staged bytes before tag binding
        shell: bash
        run: |
          set -euo pipefail
          source scripts/release/provider-pins.sh
          python3 scripts/release/verify-pretag-stage.py             --dir release-stage             --version "${{ needs.prepare.outputs.version }}"             --source-head "$GITHUB_SHA"             --codex-version "$CODEX_VERSION"             --claude-version "$CLAUDE_VERSION"
      - name: Attest build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release-stage/SHA256SUMS
      - name: Attest CycloneDX SBOM
        id: sbom_attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-stage/${{ needs.prepare.outputs.artifact_name }}
          sbom-path: release-stage/sbom.cdx.json
      - name: Export and verify release-visible tag-bound attestations
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ needs.prepare.outputs.artifact_name }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom_attestation.outputs.bundle-path }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-attestations
          provenance="release-attestations/${ARTIFACT}.provenance.sigstore.json"
          sbom="release-attestations/${ARTIFACT}.sbom.sigstore.json"
          install -m 0644 "$PROVENANCE_BUNDLE" "$provenance"
          install -m 0644 "$SBOM_BUNDLE" "$sbom"
          for subject in "$ARTIFACT" sbom.cdx.json install.sh; do
            gh attestation verify "release-stage/$subject"               -R "$GITHUB_REPOSITORY"               --bundle "$provenance"               --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"               --source-digest "$GITHUB_SHA"               --source-ref "$GITHUB_REF"               --deny-self-hosted-runners
          done
          gh attestation verify "release-stage/$ARTIFACT"             -R "$GITHUB_REPOSITORY"             --bundle "$sbom"             --predicate-type https://cyclonedx.org/bom             --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"             --source-digest "$GITHUB_SHA"             --source-ref "$GITHUB_REF"             --deny-self-hosted-runners
      - name: Upload tag-bound attestation bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-attestations-v${{ needs.prepare.outputs.version }}-${{ github.sha }}
          path: release-attestations/*
          if-no-files-found: error
          retention-days: 7

  draft-release:
    name: Promote exact staged bytes to guarded Draft
    needs: [prepare, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      attestations: read
    steps:
      - name: Check out exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download accepted staged bytes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-stage-v${{ needs.prepare.outputs.version }}-${{ github.sha }}
          path: release-stage
      - name: Download tag-bound attestations
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-attestations-v${{ needs.prepare.outputs.version }}-${{ github.sha }}
          path: release-attestations
      - name: Verify exact promotion inputs
        shell: bash
        run: |
          set -euo pipefail
          source scripts/release/provider-pins.sh
          python3 scripts/release/verify-pretag-stage.py             --dir release-stage             --version "${{ needs.prepare.outputs.version }}"             --source-head "$GITHUB_SHA"             --codex-version "$CODEX_VERSION"             --claude-version "$CLAUDE_VERSION"
          test -s "release-attestations/${{ needs.prepare.outputs.artifact_name }}.provenance.sigstore.json"
          test -s "release-attestations/${{ needs.prepare.outputs.artifact_name }}.sbom.sigstore.json"
      - name: Create or refresh Draft using accepted bytes only
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          ARTIFACT: ${{ needs.prepare.outputs.artifact_name }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          title="$tag — Clean Room Launcher"
          if gh release view "$tag" --json isDraft,isPrerelease,tagName >/tmp/clroom-release.json 2>/dev/null; then
            test "$(jq -r .isDraft /tmp/clroom-release.json)" = true
            test "$(jq -r .tagName /tmp/clroom-release.json)" = "$tag"
            test "$(jq -r .isPrerelease /tmp/clroom-release.json)" = "$PRERELEASE"
            gh release edit "$tag" --title "$title" --notes-file release-stage/release-notes.md
          else
            args=(release create "$tag" --draft --verify-tag --title "$title" --notes-file release-stage/release-notes.md)
            if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
            gh "${args[@]}"
          fi
          gh release upload "$tag"             "release-stage/$ARTIFACT"             release-stage/SHA256SUMS             release-stage/sbom.cdx.json             release-stage/install.sh             "release-attestations/$ARTIFACT.provenance.sigstore.json"             "release-attestations/$ARTIFACT.sbom.sigstore.json"             --clobber
      - name: Reconcile Draft bytes against accepted pre-tag manifest
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          ARTIFACT: ${{ needs.prepare.outputs.artifact_name }}
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/draft-reconcile"
          rm -rf "$tmp"
          mkdir -p "$tmp"
          gh release view "$GITHUB_REF_NAME" --json tagName,name,isDraft,isPrerelease,assets >"$tmp/release.json"
          python3 - "$tmp/release.json" "$GITHUB_REF_NAME" "$VERSION" "${{ needs.prepare.outputs.prerelease }}" <<'PY'
          import json, sys
          path, tag, version, prerelease = sys.argv[1:]
          data = json.load(open(path, encoding="utf-8"))
          if data.get("tagName") != tag or data.get("name") != f"{tag} — Clean Room Launcher":
              raise SystemExit("release-identity")
          if data.get("isDraft") is not True or data.get("isPrerelease") is not (prerelease == "true"):
              raise SystemExit("release-state")
          expected = {
              f"clean-room-launcher-v{version}-aarch64-apple-darwin.tar.gz",
              f"clean-room-launcher-v{version}-aarch64-apple-darwin.tar.gz.provenance.sigstore.json",
              f"clean-room-launcher-v{version}-aarch64-apple-darwin.tar.gz.sbom.sigstore.json",
              "install.sh", "sbom.cdx.json", "SHA256SUMS",
          }
          actual = {item.get("name") for item in data.get("assets", [])}
          if actual != expected:
              raise SystemExit("asset-set:" + repr(sorted(actual)))
          PY
          gh release download "$GITHUB_REF_NAME" --dir "$tmp/assets"
          python3 - release-stage/pretag-manifest.json "$tmp/assets" <<'PY'
          import hashlib, json, pathlib, sys
          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          root = pathlib.Path(sys.argv[2])
          for name in (manifest["artifact_name"], "SHA256SUMS", "sbom.cdx.json", "install.sh"):
              h = hashlib.sha256((root / name).read_bytes()).hexdigest()
              if h != manifest["files"][name]:
                  raise SystemExit("byte-drift:" + name)
          PY
          provenance="$tmp/assets/$ARTIFACT.provenance.sigstore.json"
          sbom="$tmp/assets/$ARTIFACT.sbom.sigstore.json"
          for subject in "$ARTIFACT" sbom.cdx.json install.sh; do
            gh attestation verify "$tmp/assets/$subject"               -R "$GITHUB_REPOSITORY"               --bundle "$provenance"               --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"               --source-digest "$GITHUB_SHA"               --source-ref "$GITHUB_REF"               --deny-self-hosted-runners
          done
          gh attestation verify "$tmp/assets/$ARTIFACT"             -R "$GITHUB_REPOSITORY"             --bundle "$sbom"             --predicate-type https://cyclonedx.org/bom             --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"             --source-digest "$GITHUB_SHA"             --source-ref "$GITHUB_REF"             --deny-self-hosted-runners
          echo "DRAFT_PROMOTION_RECONCILE_PASS tag=$GITHUB_REF_NAME source=$GITHUB_SHA"