name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release identity
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      artifact_name: ${{ steps.release.outputs.artifact_name }}
    steps:
      - name: Check out exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind protected tag to accepted source
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          test "$(git cat-file -t "refs/tags/$tag")" = "tag" || {
            echo "release tag must be annotated" >&2
            exit 1
          }
          expected_title="$tag — Clean Room Launcher"
          actual_title="$(git for-each-ref --format='%(contents:subject)' "refs/tags/$tag")"
          test "$actual_title" = "$expected_title" || {
            echo "annotated tag message must be version-first: $expected_title" >&2
            exit 1
          }
          python3 - "$tag" "$version" <<'PY'
          import re, sys
          tag, version = sys.argv[1:]
          if tag != "v" + version:
              raise SystemExit("release tag must start with v")
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:-rc\.[0-9]+)?", version):
              raise SystemExit("release tag must be vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.N")
          PY
          manifest_version="$(python3 - <<'PY'
          import tomllib
          with open("Cargo.toml", "rb") as handle:
              print(tomllib.load(handle)["package"]["version"])
          PY
          )"
          test "$manifest_version" = "$version" || {
            echo "Cargo.toml version $manifest_version does not match tag $tag" >&2
            exit 1
          }
          default_ref="$(git ls-remote --symref origin HEAD | awk '$1 == "ref:" && $3 == "HEAD" {print $2}')"
          test -n "$default_ref" || {
            echo "could not resolve the repository default branch" >&2
            exit 1
          }
          git fetch --no-tags --depth=1 origin "$default_ref"
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" || {
            echo "release tag must point to the exact accepted default-branch tip" >&2
            exit 1
          }
          prerelease=false
          case "$version" in
            *-rc.*) prerelease=true ;;
          esac
          artifact_name="clean-room-launcher-v${version}-aarch64-apple-darwin.tar.gz"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

  promote:
    name: Promote accepted staged bytes to Draft
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve accepted-main staged bytes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/release-stage"
          bash scripts/release/resolve-release-stage.sh "$VERSION" "$GITHUB_SHA" "$stage"
          python3 scripts/release/verify-release-stage.py \
            --stage-dir "$stage" \
            --expected-head "$GITHUB_SHA" \
            --expected-version "$VERSION"
          rm -rf release-artifacts
          mkdir -p release-artifacts
          cp "$stage"/release-assets/* release-artifacts/
          cp "$stage/release-notes.md" release-notes.md
          cp "$stage/stage-manifest.json" stage-manifest.json
          test "$(find release-artifacts -maxdepth 1 -type f | wc -l | tr -d ' ')" = 4
          (
            cd release-artifacts
            shasum -a 256 -c SHA256SUMS
          )
      - name: Attest build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release-artifacts/SHA256SUMS
      - name: Attest CycloneDX SBOM
        id: sbom_attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-artifacts/${{ needs.prepare.outputs.artifact_name }}
          sbom-path: release-artifacts/sbom.cdx.json
      - name: Export and verify tag-bound attestation bundles
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ needs.prepare.outputs.artifact_name }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom_attestation.outputs.bundle-path }}
        shell: bash
        run: |
          set -euo pipefail
          provenance="release-artifacts/${ARTIFACT}.provenance.sigstore.json"
          sbom="release-artifacts/${ARTIFACT}.sbom.sigstore.json"
          install -m 0644 "$PROVENANCE_BUNDLE" "$provenance"
          install -m 0644 "$SBOM_BUNDLE" "$sbom"
          test -s "$provenance"
          test -s "$sbom"
          for subject in "$ARTIFACT" sbom.cdx.json install.sh; do
            gh attestation verify "release-artifacts/$subject" \
              -R "$GITHUB_REPOSITORY" \
              --bundle "$provenance" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners
          done
          gh attestation verify "release-artifacts/$ARTIFACT" \
            -R "$GITHUB_REPOSITORY" \
            --bundle "$sbom" \
            --predicate-type https://cyclonedx.org/bom \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --deny-self-hosted-runners
      - name: Create or refresh guarded Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          title="$GITHUB_REF_NAME — Clean Room Launcher"
          if gh release view "$tag" --json isDraft,isPrerelease,tagName >/tmp/clroom-release.json 2>/dev/null; then
            test "$(jq -r .isDraft /tmp/clroom-release.json)" = true || {
              echo "refusing to modify an already-published release" >&2
              exit 1
            }
            test "$(jq -r .tagName /tmp/clroom-release.json)" = "$tag" || {
              echo "draft release tag mismatch" >&2
              exit 1
            }
            test "$(jq -r .isPrerelease /tmp/clroom-release.json)" = "$PRERELEASE" || {
              echo "draft release prerelease state mismatch" >&2
              exit 1
            }
            gh release edit "$tag" --title "$title" --notes-file release-notes.md
          else
            args=(release create "$tag" --draft --verify-tag --title "$title" --notes-file release-notes.md)
            if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
            gh "${args[@]}"
          fi
          gh release upload "$tag" release-artifacts/* --clobber
      - name: Reconcile uploaded Draft bytes
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ needs.prepare.outputs.artifact_name }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          gh release view "$tag" --json isDraft,isPrerelease,tagName,assets > /tmp/clroom-release.json
          test "$(jq -r .isDraft /tmp/clroom-release.json)" = true
          test "$(jq -r .isPrerelease /tmp/clroom-release.json)" = "$PRERELEASE"
          test "$(jq -r .tagName /tmp/clroom-release.json)" = "$tag"
          test "$(jq '.assets | length' /tmp/clroom-release.json)" = 6

          remote="$RUNNER_TEMP/release-roundtrip"
          rm -rf "$remote"
          mkdir -p "$remote"
          gh release download "$tag" --dir "$remote"
          test "$(find "$remote" -maxdepth 1 -type f | wc -l | tr -d ' ')" = 6

          for name in "$ARTIFACT" SHA256SUMS sbom.cdx.json install.sh \
            "${ARTIFACT}.provenance.sigstore.json" "${ARTIFACT}.sbom.sigstore.json"; do
            test -s "$remote/$name"
            cmp "release-artifacts/$name" "$remote/$name"
          done
          (
            cd "$remote"
            shasum -a 256 -c SHA256SUMS
          )

          gh attestation verify "$remote/$ARTIFACT" \
            -R "$GITHUB_REPOSITORY" \
            --bundle "$remote/${ARTIFACT}.provenance.sigstore.json" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --deny-self-hosted-runners
          gh attestation verify "$remote/$ARTIFACT" \
            -R "$GITHUB_REPOSITORY" \
            --bundle "$remote/${ARTIFACT}.sbom.sigstore.json" \
            --predicate-type https://cyclonedx.org/bom \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --deny-self-hosted-runners

          echo "DRAFT_PROMOTION_RECONCILED tag=$tag head=$GITHUB_SHA"
