name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate tag and resolve accepted pre-tag stage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      artifact_name: ${{ steps.release.outputs.artifact_name }}
    steps:
      - name: Check out exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Bind tag identity
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          test "$(git cat-file -t "refs/tags/$tag")" = tag
          expected_title="$tag — Clean Room Launcher"
          test "$(git for-each-ref --format='%(contents:subject)' "refs/tags/$tag")" = "$expected_title"
          tag_date="$(python3 - "$tag" <<'PY'
          import datetime,re,subprocess,sys
          raw=subprocess.check_output(["git","cat-file","-p",f"refs/tags/{sys.argv[1]}"],text=True)
          line=next(x for x in raw.splitlines() if x.startswith("tagger "))
          m=re.search(r" (\d+) ([+-])(\d{2})(\d{2})$",line)
          if not m: raise SystemExit("tagger timestamp malformed")
          minutes=int(m.group(3))*60+int(m.group(4))
          if m.group(2)=="-": minutes=-minutes
          tz=datetime.timezone(datetime.timedelta(minutes=minutes))
          print(datetime.datetime.fromtimestamp(int(m.group(1)),tz=tz).date().isoformat())
          PY
          )"
          python3 scripts/release/check-release-contract.py --tag-date "$tag_date" --report >/dev/null
          manifest_version="$(python3 - <<'PY'
          import tomllib
          print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])
          PY
          )"
          test "$manifest_version" = "$version"
          default_ref="$(git ls-remote --symref origin HEAD | awk '$1=="ref:" && $3=="HEAD" {print $2}')"
          test -n "$default_ref"
          git fetch --no-tags --depth=1 origin "$default_ref"
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          prerelease=false
          case "$version" in *-rc.*) prerelease=true ;; esac
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >>"$GITHUB_OUTPUT"
          echo "artifact_name=clean-room-launcher-v${version}-aarch64-apple-darwin.tar.gz" >>"$GITHUB_OUTPUT"
      - name: Resolve exact accepted stage
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/release/resolve-release-stage.sh "$VERSION" "$GITHUB_SHA" "$RUNNER_TEMP/release-stage"
      - name: Handoff accepted stage without rebuilding
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-stage-v${{ steps.release.outputs.version }}-${{ github.sha }}
          path: ${{ runner.temp }}/release-stage
          if-no-files-found: error
          retention-days: 7

  attest:
    name: Bind accepted bytes to exact tag attestations
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download accepted stage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: promotion-stage-v${{ needs.prepare.outputs.version }}-${{ github.sha }}
          path: release-stage
      - name: Reconcile accepted stage
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 scripts/release/stage-manifest.py verify --root release-stage --version "$VERSION" --source-head "$GITHUB_SHA"
      - name: Attest build provenance for exact tag
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release-stage/SHA256SUMS
      - name: Attest CycloneDX SBOM for exact tag
        id: sbom_attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-stage/${{ needs.prepare.outputs.artifact_name }}
          sbom-path: release-stage/sbom.cdx.json
      - name: Export tag-bound attestation bundles
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom_attestation.outputs.bundle-path }}
          ARTIFACT: ${{ needs.prepare.outputs.artifact_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tag-attestations
          install -m 0644 "$PROVENANCE_BUNDLE" "tag-attestations/$ARTIFACT.provenance.sigstore.json"
          install -m 0644 "$SBOM_BUNDLE" "tag-attestations/$ARTIFACT.sbom.sigstore.json"
      - name: Upload tag-bound attestations
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-attestations
          path: tag-attestations
          if-no-files-found: error
          retention-days: 7

  draft-release:
    name: Promote accepted bytes to guarded Draft
    needs: [prepare, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download accepted stage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: promotion-stage-v${{ needs.prepare.outputs.version }}-${{ github.sha }}
          path: release-stage
      - name: Download tag-bound attestations
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-attestations
          path: tag-attestations
      - name: Reconcile promotion inputs
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ARTIFACT: ${{ needs.prepare.outputs.artifact_name }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release/stage-manifest.py verify --root release-stage --version "$VERSION" --source-head "$GITHUB_SHA"
          test -s "tag-attestations/$ARTIFACT.provenance.sigstore.json"
          test -s "tag-attestations/$ARTIFACT.sbom.sigstore.json"
          mkdir -p public-assets
          install -m 0644 "release-stage/$ARTIFACT" public-assets/
          install -m 0644 release-stage/SHA256SUMS public-assets/
          install -m 0644 release-stage/sbom.cdx.json public-assets/
          install -m 0755 release-stage/install.sh public-assets/
          install -m 0644 "tag-attestations/$ARTIFACT.provenance.sigstore.json" public-assets/
          install -m 0644 "tag-attestations/$ARTIFACT.sbom.sigstore.json" public-assets/
          test "$(find public-assets -maxdepth 1 -type f | wc -l | tr -d ' ')" = 6
      - name: Create or refresh Draft using pre-rendered notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          title="$tag — Clean Room Launcher"
          if gh release view "$tag" --json isDraft,isPrerelease,tagName >/tmp/release.json 2>/dev/null; then
            test "$(jq -r .isDraft /tmp/release.json)" = true
            test "$(jq -r .tagName /tmp/release.json)" = "$tag"
            test "$(jq -r .isPrerelease /tmp/release.json)" = "$PRERELEASE"
            gh release edit "$tag" --title "$title" --notes-file release-stage/release-notes.md
          else
            args=(release create "$tag" --draft --verify-tag --title "$title" --notes-file release-stage/release-notes.md)
            if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
            gh "${args[@]}"
          fi
          gh release upload "$tag" public-assets/* --clobber

  reconcile:
    name: Reconcile Draft to accepted pre-tag manifest
    needs: [prepare, draft-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Check out exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download accepted stage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: promotion-stage-v${{ needs.prepare.outputs.version }}-${{ github.sha }}
          path: release-stage
      - name: Download and verify exact Draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          ARTIFACT: ${{ needs.prepare.outputs.artifact_name }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release/stage-manifest.py verify --root release-stage --version "$VERSION" --source-head "$GITHUB_SHA"
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true
          mkdir -p draft-assets
          gh release download "$GITHUB_REF_NAME" --dir draft-assets
          test "$(find draft-assets -maxdepth 1 -type f | wc -l | tr -d ' ')" = 6
          for name in "$ARTIFACT" SHA256SUMS sbom.cdx.json install.sh; do
            cmp "release-stage/$name" "draft-assets/$name"
          done
          (
            cd draft-assets
            shasum -a 256 -c SHA256SUMS
          )
          provenance="draft-assets/$ARTIFACT.provenance.sigstore.json"
          sbom="draft-assets/$ARTIFACT.sbom.sigstore.json"
          for subject in "$ARTIFACT" sbom.cdx.json install.sh; do
            gh attestation verify "draft-assets/$subject" -R "$GITHUB_REPOSITORY" --bundle "$provenance" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF" --deny-self-hosted-runners
          done
          gh attestation verify "draft-assets/$ARTIFACT" -R "$GITHUB_REPOSITORY" --bundle "$sbom" --predicate-type https://cyclonedx.org/bom --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF" --deny-self-hosted-runners
          echo "DRAFT_PROMOTION_RECONCILE_PASS tag=$GITHUB_REF_NAME source=$GITHUB_SHA"
