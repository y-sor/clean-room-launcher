name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  harness-contract:
    name: Validate harness contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run harness contract self-tests
        run: |
          python3 scripts/release/check-harness-contract.py --self-test
          python3 scripts/release/stage-binding.py --self-test
      - name: Validate repository harness topology
        run: python3 scripts/release/check-harness-contract.py
  target-matrix:
    name: Validate packaging target matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate declared matrix
        run: |
          test -s packaging/targets.toml
          advertised=$(sed -n 's/^advertised_targets = \[\(.*\)\]/\1/p' packaging/targets.toml)
          qualified=$(sed -n 's/^qualified_targets = \[\(.*\)\]/\1/p' packaging/targets.toml)
          test "$advertised" = "$qualified"
      - name: Validate qualified target metadata
        run: |
          qualified=$(sed -n 's/^qualified_targets = \[\(.*\)\]/\1/p' packaging/targets.toml | tr -d '"' | tr ',' ' ')
          for target_name in $qualified; do
            entry=$(grep -A8 "name = \"$target_name\"" packaging/targets.toml)
            printf '%s\n' "$entry" | grep -q 'qualification_status = "INTEGRITY_VERIFIED"'
            printf '%s\n' "$entry" | grep -q 'rust_target = "[^"]\+"'
            printf '%s\n' "$entry" | grep -q 'runner = "[^"]\+"'
          done
      - name: Run target-matrix fixtures
        run: |
          CARGO_MANIFEST_DIR="$PWD" rustc --test tests/packaging/target_matrix.rs -o /tmp/clroom-target-matrix
          /tmp/clroom-target-matrix

  docs-discovery:
    name: Validate docs discovery assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate public repository boundary
        run: scripts/check-public-boundary.sh --root "$PWD"
      - name: Prove legacy namespace guard fails closed
        run: |
          set -euo pipefail
          probe=$(mktemp -d "${TMPDIR:-/tmp}/clroom-namespace-negative.XXXXXX")
          output=$(mktemp "${TMPDIR:-/tmp}/clroom-namespace-negative-output.XXXXXX")
          cleanup() {
            rm -rf -- "$probe"
            rm -f -- "$output"
          }
          trap cleanup EXIT HUP INT TERM

          legacy_owner=$(printf '%s%s' 'EWGENIJ87SN' 'WORK')

          printf 'https://github.com/%s/clean-room-launcher\n' "$legacy_owner" > "$probe/README.md"
          if scripts/check-public-boundary.sh --root "$probe" >"$output" 2>&1; then
            echo 'legacy repository namespace unexpectedly passed public boundary' >&2
            exit 1
          fi
          grep -Fq 'LEGACY_REPOSITORY_NAMESPACE:README.md' "$output"

          printf 'https://%s.github.io/clean-room-launcher/\n' "$legacy_owner" > "$probe/README.md"
          if scripts/check-public-boundary.sh --root "$probe" >"$output" 2>&1; then
            echo 'legacy Pages namespace unexpectedly passed public boundary' >&2
            exit 1
          fi
          grep -Fq 'LEGACY_REPOSITORY_NAMESPACE:README.md' "$output"
      - name: Validate discovery asset contract
        run: |
          set -euo pipefail

          test -s docs/sitemap.xml
          grep -Fq 'permalink: /sitemap.xml' docs/sitemap.xml
          grep -Fq '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' docs/sitemap.xml

          test -s docs/robots.txt
          grep -Fq 'current GitHub Pages site is a project site' docs/robots.txt
          grep -Fq 'User-agent: OAI-SearchBot' docs/robots.txt
          grep -Fq 'User-agent: Claude-SearchBot' docs/robots.txt
          grep -Fq 'User-agent: Claude-User' docs/robots.txt
          grep -Fq 'User-agent: PerplexityBot' docs/robots.txt
          grep -Fq 'Sitemap: https://y-sor.github.io/clean-room-launcher/sitemap.xml' docs/robots.txt

          test -s docs/llms.txt
          grep -Fq 'permalink: /llms.txt' docs/llms.txt
          grep -Fq 'https://y-sor.github.io/clean-room-launcher/problem-index/' docs/llms.txt
          grep -Fq 'https://y-sor.github.io/clean-room-launcher/sitemap.xml' docs/llms.txt
          grep -Fq 'Provider-owned/system skills and project-local skills are separate scopes' docs/llms.txt

          test -s docs/problem-index.md
          grep -Fq '<a id="codex-built-in-and-project-skills"></a>' docs/problem-index.md
          grep -Fq '<a id="create-edit-and-combine-skill-sets"></a>' docs/problem-index.md
          test "$(grep -Fc '<summary>More related wording and searches</summary>' docs/problem-index.md)" -ge 20
          test "$(grep -Ec '^- `[^`]+`$' docs/problem-index.md)" -ge 319

          grep -Fq 'Why does Codex show more skills than the CLROOM `Global skills` count?' docs/faq.md

          grep -Fq 'url: "https://y-sor.github.io"' docs/_config.yml
          grep -Fq 'repository: y-sor/clean-room-launcher' docs/_config.yml
          grep -Fq 'baseurl: "/clean-room-launcher"' docs/_config.yml
          grep -Fq 'parse_block_html: true' docs/_config.yml
          ! grep -Eq '^[[:space:]]*-[[:space:]]+jekyll-sitemap[[:space:]]*$' docs/_config.yml
      - name: Validate sitemap parser and negative cases
        run: python3 scripts/probe/check-sitemap.py --source-root "$PWD"

  qualified-target-lanes:
    name: Build qualified target lane
    needs: target-matrix
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: alpha-macos-aarch64
            runner: macos-14
            rust_target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo test --locked --all-targets --target "${{ matrix.rust_target }}"
      - name: Build shipped binaries without warnings
        run: RUSTFLAGS='-D warnings' cargo build --locked --release --bins --target "${{ matrix.rust_target }}"

  required:
    name: Required
    needs: [harness-contract, target-matrix, docs-discovery, qualified-target-lanes]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require complete CI topology
        env:
          HARNESS: ${{ needs.harness-contract.result }}
          TARGET: ${{ needs.target-matrix.result }}
          DOCS: ${{ needs.docs-discovery.result }}
          QUALIFIED: ${{ needs.qualified-target-lanes.result }}
        run: |
          set -euo pipefail
          test "$HARNESS" = success
          test "$TARGET" = success
          test "$DOCS" = success
          test "$QUALIFIED" = success
          echo "CI_REQUIRED_PASS"
