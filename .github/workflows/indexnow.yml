name: IndexNow

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Wait for same-SHA CI and Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            : "$attempt"
            runs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100" --jq '.workflow_runs[] | [.name, .status, (.conclusion // "")] | @tsv')
            ci=$(printf '%s\n' "$runs" | awk -F '\t' '$1 == "CI" { print; exit }')
            pages=$(printf '%s\n' "$runs" | awk -F '\t' '$1 == "pages build and deployment" { print; exit }')
            ci_status=$(printf '%s\n' "$ci" | cut -f2)
            ci_conclusion=$(printf '%s\n' "$ci" | cut -f3)
            pages_status=$(printf '%s\n' "$pages" | cut -f2)
            pages_conclusion=$(printf '%s\n' "$pages" | cut -f3)
            if [ "$ci_status" = completed ] && [ "$ci_conclusion" != success ]; then echo "CI failed: $ci_conclusion"; exit 1; fi
            if [ "$pages_status" = completed ] && [ "$pages_conclusion" != success ]; then echo "Pages failed: $pages_conclusion"; exit 1; fi
            if [ "$ci_status" = completed ] && [ "$ci_conclusion" = success ] && [ "$pages_status" = completed ] && [ "$pages_conclusion" = success ]; then exit 0; fi
            sleep 10
          done
          echo "Timed out waiting for same-SHA CI and Pages deployment"
          exit 1
      - name: Verify published sitemap canary
        run: python3 scripts/probe/check-sitemap.py --live
      - name: Notify IndexNow
        run: |
          bootstrap_args=()
          key_added=false
          if git diff --name-status "$GITHUB_EVENT_BEFORE" "$GITHUB_SHA" -- "docs/NDUteiLX5uhpX0oG3CF-GEK1uoInbc5y.txt" | grep -q '^A'; then
            key_added=true
          fi
          notified=false
          prior_runs=$(gh run list --workflow indexnow.yml --branch "$GITHUB_REF_NAME" --limit 20 --json databaseId,headSha,conclusion --jq '.[] | [.databaseId, .headSha, (.conclusion // "")] | @tsv')
          while IFS=$'\t' read -r run_id run_sha conclusion; do
            [ -z "$run_id" ] && continue
            [ "$run_sha" = "$GITHUB_SHA" ] && continue
            if [ "$conclusion" = success ] && gh run view "$run_id" --log 2>/dev/null | grep -Eq 'INDEXNOW_HTTP=(200|202)'; then
              notified=true
              break
            fi
          done <<<"$prior_runs"
          if [ "$key_added" = true ] || [ "$notified" != true ]; then
            bootstrap_args+=(--bootstrap)
          fi
          python3 scripts/indexnow_changed_urls.py \
            --root . \
            --before "$GITHUB_EVENT_BEFORE" \
            --after "$GITHUB_SHA" \
            --key-file "docs/NDUteiLX5uhpX0oG3CF-GEK1uoInbc5y.txt" \
            "${bootstrap_args[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
