name: Release candidate readiness

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-readiness:
    name: CLROOM release readiness
    runs-on: macos-14
    outputs:
      stage_artifact_name: ${{ steps.stage.outputs.artifact_name }}
      stage_ready: ${{ steps.stage.outputs.ready }}
    steps:
      - name: Check out exact PR HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Resolve published release lifecycle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          candidate_version="$(python3 - <<'PY'
          import tomllib
          with open("Cargo.toml", "rb") as handle:
              print(tomllib.load(handle)["package"]["version"])
          PY
          )"
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest")"
          latest_tag="$(jq -r .tag_name <<<"$release_json")"
          test -n "$latest_tag"
          test "$(jq -r .draft <<<"$release_json")" = false
          test "$(jq -r .prerelease <<<"$release_json")" = false
          test "$(jq -r .immutable <<<"$release_json")" = true
          lifecycle="$(python3 scripts/release/resolve-release-lifecycle.py \
            --candidate-version "$candidate_version" \
            --published-tag "$latest_tag")"
          if ! git rev-parse --verify "refs/tags/$latest_tag^{commit}" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/$latest_tag:refs/tags/$latest_tag"
          fi
          git rev-parse --verify "refs/tags/$latest_tag^{commit}" >/dev/null
          echo "CLROOM_RELEASE_VERSION=$candidate_version" >> "$GITHUB_ENV"
          echo "CLROOM_RELEASE_BASE_REF=$latest_tag" >> "$GITHUB_ENV"
          echo "CLROOM_RELEASE_LIFECYCLE=$lifecycle" >> "$GITHUB_ENV"
          printf 'RELEASE_LIFECYCLE=%s version=%s baseline=%s\n' "$lifecycle" "$candidate_version" "$latest_tag"
      - name: Prove release attestation contract fails closed
        shell: bash
        run: |
          set -euo pipefail
          probe=$(mktemp "${TMPDIR:-/tmp}/clroom-attestation-contract.XXXXXX")
          output=$(mktemp "${TMPDIR:-/tmp}/clroom-attestation-contract-output.XXXXXX")
          cleanup() {
            rm -f -- "$probe" "$output"
          }
          trap cleanup EXIT HUP INT TERM
          grep -Fv -- 'uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2' \
            .github/workflows/release.yml > "$probe"
          if scripts/release/check-attestation-contract.sh "$probe" >"$output" 2>&1; then
            echo "release attestation contract unexpectedly passed without pinned attestation action" >&2
            exit 1
          fi
          grep -Fq 'RELEASE_ATTESTATION_CONTRACT_BLOCKED:RELEASE_ATTEST_ACTION_PIN' "$output"
      - name: Provision existing Python supply-chain verifier
        shell: bash
        run: |
          set -euo pipefail
          verifier_root="$RUNNER_TEMP/clroom-supply-chain-verifier"
          python3 -m venv "$verifier_root"
          "$verifier_root/bin/python" -m pip install --disable-pip-version-check --no-input \
            "jsonschema==4.26.0"
          echo "$verifier_root/bin" >> "$GITHUB_PATH"
          test "$("$verifier_root/bin/python" -c 'import importlib.metadata; print(importlib.metadata.version("jsonschema"))')" = "4.26.0"
      - name: Install cargo-deny 0.20.2 verification tool
        shell: bash
        run: |
          set -euo pipefail
          asset=""
          expected=""
          case "$(uname -m)" in
            arm64)
              asset="cargo-deny-0.20.2-aarch64-apple-darwin.tar.gz"
              expected="fe67d82a10d8597a3549364cb733a3f9cc1bfff9031b7ae46384a9f2a72090c3"
              ;;
            x86_64)
              asset="cargo-deny-0.20.2-x86_64-apple-darwin.tar.gz"
              expected="248da7f581724e470071990c088ffc55c811981715f4cbdb258621fb79f8b7a6"
              ;;
            *)
              echo "unsupported runner architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          archive="$RUNNER_TEMP/$asset"
          curl --fail --location --silent --show-error --retry 3 \
            --output "$archive" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/$asset"
          actual="$(shasum -a 256 "$archive" | awk '{print $1}')"
          test "$actual" = "$expected"
          tool_root="$RUNNER_TEMP/cargo-deny-0.20.2"
          mkdir -p "$tool_root"
          tar -xzf "$archive" -C "$tool_root"
          tool="$(find "$tool_root" -type f -name cargo-deny -print -quit)"
          test -n "$tool"
          tool_dir="$RUNNER_TEMP/cargo-deny-bin"
          mkdir -p "$tool_dir"
          install -m 0755 "$tool" "$tool_dir/cargo-deny"
          echo "$tool_dir" >> "$GITHUB_PATH"
          test "$("$tool_dir/cargo-deny" --version)" = "cargo-deny 0.20.2"
      - name: Provision pinned real provider canaries
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CLROOM_RELEASE_LIFECYCLE" == "POST_PUBLISH" ]]; then
            echo "PROVIDER_CANARY_SKIPPED lifecycle=POST_PUBLISH"
            exit 0
          fi
          [[ "$CLROOM_RELEASE_LIFECYCLE" == "ACTIVE_CANDIDATE" ]] || {
            echo "invalid release lifecycle: $CLROOM_RELEASE_LIFECYCLE" >&2
            exit 1
          }
          ./scripts/release/provision-provider-canaries.sh "$RUNNER_TEMP/clroom-providers" "$GITHUB_ENV"
          echo "CLROOM_QUALIFICATION_EVIDENCE_DIR=$RUNNER_TEMP/clroom-qualification" >> "$GITHUB_ENV"
      - name: Run canonical fail-closed gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/release/readiness.sh
      - name: Rehearse Codex runtime on exact PR candidate
        if: github.event_name == 'pull_request' && env.CLROOM_RELEASE_LIFECYCLE == 'ACTIVE_CANDIDATE'
        id: codex_rehearsal
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidate_sha="${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD)" = "$candidate_sha"
          evidence_dir="$RUNNER_TEMP/clroom-release-evidence"
          provider_bin="$RUNNER_TEMP/clroom-codex-rehearsal-bin"
          mkdir -p "$evidence_dir" "$provider_bin"
          ln -s "$CLROOM_PROVIDER_CODEX" "$provider_bin/codex"
          PATH="$provider_bin:$PATH" \
          CLROOM_RELEASE_EVIDENCE_DIR="$evidence_dir" \
            bash scripts/release/local-codex-plugin-activation-smoke.sh rehearse \
              --expected-head "$candidate_sha" \
              --fixture-standalone-mcp
          digest="$(python3 - <<'PY'
          import json
          with open(f"reports/release/v{__import__('os').environ['CLROOM_RELEASE_VERSION']}-review.json", encoding="utf-8") as handle:
              print(json.load(handle)["reviewed_content_digest"])
          PY
          )"
          key="${digest:0:12}"
          evidence="$evidence_dir/codex-rehearse-v${CLROOM_RELEASE_VERSION}-${key}.json"
          test -s "$evidence"
          artifact_name="codex-rehearsal-v${CLROOM_RELEASE_VERSION}-${digest}"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "evidence=$evidence" >> "$GITHUB_OUTPUT"
      - name: Upload Codex pre-merge rehearsal evidence
        if: github.event_name == 'pull_request' && steps.codex_rehearsal.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.codex_rehearsal.outputs.artifact_name }}
          path: ${{ steps.codex_rehearsal.outputs.evidence }}
          if-no-files-found: error
          retention-days: 30
      - name: Stage exact accepted-main release bytes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CLROOM_RELEASE_LIFECYCLE == 'ACTIVE_CANDIDATE'
        id: stage
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_head="$GITHUB_SHA"
          version="$CLROOM_RELEASE_VERSION"
          test "$(git rev-parse HEAD)" = "$source_head"
          artifact="target/release-candidate/clean-room-launcher-v${version}-aarch64-apple-darwin.tar.gz"
          test -s "$artifact"

          stage_work="$RUNNER_TEMP/clroom-release-stage-work"
          stage_root="$RUNNER_TEMP/clroom-release-stage"
          qualification="$RUNNER_TEMP/clroom-stage-qualification"
          codex_evidence_dir="$RUNNER_TEMP/clroom-stage-codex-evidence"
          extract_dir="$RUNNER_TEMP/clroom-stage-extract"
          rm -rf "$stage_work" "$stage_root" "$qualification" "$codex_evidence_dir" "$extract_dir"
          mkdir -p "$stage_work" "$qualification" "$codex_evidence_dir" "$extract_dir"

          cargo metadata --locked --offline --filter-platform aarch64-apple-darwin --format-version 1 \
            > "$stage_work/cargo-metadata.json"
          python3 packaging/generate-release-sbom.py \
            --artifact "$artifact" \
            --metadata "$stage_work/cargo-metadata.json" \
            --output "$stage_work/sbom.cdx.json"

          tar -xzf "$artifact" -C "$extract_dir"
          archive_root="$(find "$extract_dir" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$archive_root"
          codex_candidate="$archive_root/bin/clroom-codex"
          claude_candidate="$archive_root/bin/clroom-claude"
          test -x "$codex_candidate"
          test -x "$claude_candidate"

          scripts/release/qualify-real-provider.sh \
            --provider codex \
            --executable "$CLROOM_PROVIDER_CODEX" \
            --expected-provider-version "$CLROOM_PROVIDER_CODEX_VERSION" \
            --candidate "$codex_candidate" \
            --source-head "$source_head" \
            --version "$version" \
            --output "$qualification/codex.json"
          scripts/release/qualify-real-provider.sh \
            --provider claude \
            --executable "$CLROOM_PROVIDER_CLAUDE" \
            --expected-provider-version "$CLROOM_PROVIDER_CLAUDE_VERSION" \
            --candidate "$claude_candidate" \
            --source-head "$source_head" \
            --version "$version" \
            --output "$qualification/claude.json"
          python3 scripts/release/verify-qualification.py \
            "$artifact" "$qualification/codex.json" \
            "$source_head" "$version" codex "$CLROOM_PROVIDER_CODEX_VERSION"
          python3 scripts/release/verify-qualification.py \
            "$artifact" "$qualification/claude.json" \
            "$source_head" "$version" claude "$CLROOM_PROVIDER_CLAUDE_VERSION"

          provider_bin="$RUNNER_TEMP/clroom-stage-codex-bin"
          mkdir -p "$provider_bin"
          ln -s "$CLROOM_PROVIDER_CODEX" "$provider_bin/codex"
          PATH="$provider_bin:$PATH" \
          CLROOM_RELEASE_EVIDENCE_DIR="$codex_evidence_dir" \
            bash scripts/release/local-codex-plugin-activation-smoke.sh stage \
              --expected-head "$source_head" \
              --artifact "$artifact" \
              --fixture-standalone-mcp

          codex_evidence="$codex_evidence_dir/codex-stage-v${version}-${source_head:0:12}.json"
          test -s "$codex_evidence"

          python3 scripts/release/prepare-release-stage.py \
            --stage-dir "$stage_root" \
            --artifact "$artifact" \
            --sbom "$stage_work/sbom.cdx.json" \
            --install install.sh \
            --codex-evidence "$codex_evidence" \
            --codex-qualification "$qualification/codex.json" \
            --claude-qualification "$qualification/claude.json" \
            --source-head "$source_head"
          python3 scripts/release/verify-release-stage.py \
            --stage-dir "$stage_root" \
            --expected-head "$source_head" \
            --expected-version "$version"

          artifact_name="release-stage-v${version}-${source_head}"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "stage_dir=$stage_root" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Upload accepted-main release stage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.stage.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.stage.outputs.artifact_name }}
          path: ${{ steps.stage.outputs.stage_dir }}
          if-no-files-found: error
          retention-days: 30

  attest-stage:
    name: Rehearse staged attestation mechanism
    needs: release-readiness
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release-readiness.outputs.stage_ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out accepted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download accepted-main release stage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.release-readiness.outputs.stage_artifact_name }}
          path: release-stage
      - name: Rehearse promotion token Actions-read capability
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE_ARTIFACT_NAME: ${{ needs.release-readiness.outputs.stage_artifact_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            > "$RUNNER_TEMP/stage-artifacts.json"
          jq -e --arg name "$STAGE_ARTIFACT_NAME" \
            '.artifacts | any(.name == $name and .expired == false)' \
            "$RUNNER_TEMP/stage-artifacts.json" >/dev/null
          probe="$RUNNER_TEMP/stage-actions-read-probe"
          rm -rf "$probe"
          mkdir -p "$probe"
          gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" \
            -n "$STAGE_ARTIFACT_NAME" -D "$probe"
          cmp release-stage/stage-manifest.json "$probe/stage-manifest.json"
          echo "PROMOTION_ACTIONS_READ_REHEARSAL_PASS"
      - name: Verify staged bytes before attestation rehearsal
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 - <<'PY'
          import tomllib
          with open("Cargo.toml", "rb") as handle:
              print(tomllib.load(handle)["package"]["version"])
          PY
          )"
          python3 scripts/release/verify-release-stage.py \
            --stage-dir release-stage \
            --expected-head "$GITHUB_SHA" \
            --expected-version "$version"
      - name: Rehearse build provenance attestation
        id: stage_provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release-stage/release-assets/SHA256SUMS
      - name: Read staged manifest
        id: stage_meta
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(jq -c . release-stage/stage-manifest.json)"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
      - name: Rehearse CycloneDX SBOM attestation
        id: stage_sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-stage/release-assets/${{ fromJSON(steps.stage_meta.outputs.manifest).artifact_name }}
          sbom-path: release-stage/release-assets/sbom.cdx.json
      - name: Verify attestation rehearsal
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_BUNDLE: ${{ steps.stage_provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.stage_sbom.outputs.bundle-path }}
        shell: bash
        run: |
          set -euo pipefail
          artifact="$(jq -r .artifact_name release-stage/stage-manifest.json)"
          provenance="$PROVENANCE_BUNDLE"
          sbom="$SBOM_BUNDLE"
          for subject in "$artifact" sbom.cdx.json install.sh; do
            gh attestation verify "release-stage/release-assets/$subject" \
              -R "$GITHUB_REPOSITORY" \
              --bundle "$provenance" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-candidate.yml" \
              --source-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners
          done
          gh attestation verify "release-stage/release-assets/$artifact" \
            -R "$GITHUB_REPOSITORY" \
            --bundle "$sbom" \
            --predicate-type https://cyclonedx.org/bom \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-candidate.yml" \
            --source-digest "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --deny-self-hosted-runners
