name: Release candidate readiness

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-eligibility:
    name: Release eligibility and harness seal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.lifecycle.outputs.version }}
      lifecycle: ${{ steps.lifecycle.outputs.lifecycle }}
      baseline: ${{ steps.lifecycle.outputs.baseline }}
      tag_source: ${{ steps.lifecycle.outputs.tag_source }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Validate cheap harness invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release/check-harness-contract.py --self-test
          python3 scripts/release/check-harness-contract.py
          python3 scripts/release/resolve-release-lifecycle.py --self-test
          python3 scripts/release/stage-binding.py --self-test
          python3 scripts/release/pretag-run-admission.py --self-test
          python3 scripts/release/check-workflow-exec-contract.py --self-test
          python3 scripts/release/check-workflow-exec-contract.py
          python3 scripts/release/check-release-contract.py --self-test
      - name: Probe post-tag GitHub action capabilities on representative runner
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/release/check-publish-toolchain.sh --self-test
          bash scripts/release/check-publish-toolchain.sh --capabilities-only
      - name: Resolve published release lifecycle
        id: lifecycle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          candidate_version="$(python3 - <<'PY'
          import tomllib
          with open("Cargo.toml", "rb") as handle:
              print(tomllib.load(handle)["package"]["version"])
          PY
          )"
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest")"
          latest_tag="$(jq -r .tag_name <<<"$release_json")"
          test -n "$latest_tag"
          test "$(jq -r .draft <<<"$release_json")" = false
          test "$(jq -r .prerelease <<<"$release_json")" = false
          test "$(jq -r .immutable <<<"$release_json")" = true
          source_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          candidate_tag="v$candidate_version"
          candidate_tag_source=""
          if git rev-parse --verify "refs/tags/$candidate_tag^{commit}" >/dev/null 2>&1; then
            candidate_tag_source="$(git rev-parse "refs/tags/$candidate_tag^{commit}")"
          fi
          lifecycle_args=(
            --candidate-version "$candidate_version"
            --published-tag "$latest_tag"
            --candidate-source "$source_sha"
          )
          if [[ -n "$candidate_tag_source" ]]; then
            lifecycle_args+=(--candidate-tag-source "$candidate_tag_source")
          fi
          lifecycle="$(python3 scripts/release/resolve-release-lifecycle.py "${lifecycle_args[@]}")"
          if ! git rev-parse --verify "refs/tags/$latest_tag^{commit}" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/$latest_tag:refs/tags/$latest_tag"
          fi
          git rev-parse --verify "refs/tags/$latest_tag^{commit}" >/dev/null
          echo "version=$candidate_version" >> "$GITHUB_OUTPUT"
          echo "lifecycle=$lifecycle" >> "$GITHUB_OUTPUT"
          echo "baseline=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "tag_source=$candidate_tag_source" >> "$GITHUB_OUTPUT"
          printf 'RELEASE_LIFECYCLE=%s version=%s baseline=%s tag_source=%s\n' \
            "$lifecycle" "$candidate_version" "$latest_tag" "$candidate_tag_source"
      - name: Validate consumed release identity quarantine
        if: steps.lifecycle.outputs.lifecycle == 'RELEASE_QUARANTINED'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.lifecycle.outputs.version }}"
          tag_source="${{ steps.lifecycle.outputs.tag_source }}"
          test -n "$tag_source"
          test "$(git rev-parse "refs/tags/v$version^{commit}")" = "$tag_source"
          echo "RELEASE_QUARANTINE_PASS version=$version tag_source=$tag_source"
      - name: Validate active candidate seal before expensive lanes
        if: steps.lifecycle.outputs.lifecycle == 'ACTIVE_CANDIDATE'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/release/check-release-contract.py --report >/dev/null
  release-readiness:
    name: CLROOM release readiness
    needs: release-eligibility
    if: needs.release-eligibility.outputs.lifecycle != 'RELEASE_QUARANTINED'
    runs-on: macos-14
    timeout-minutes: 45
    env:
      CLROOM_RELEASE_VERSION: ${{ needs.release-eligibility.outputs.version }}
      CLROOM_RELEASE_BASE_REF: ${{ needs.release-eligibility.outputs.baseline }}
      CLROOM_RELEASE_LIFECYCLE: ${{ needs.release-eligibility.outputs.lifecycle }}
    steps:
      - name: Check out exact PR HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Validate workflow-local execution parity
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release/check-workflow-exec-contract.py --self-test
          python3 scripts/release/check-workflow-exec-contract.py
      - name: Prove release attestation contract fails closed
        shell: bash
        run: |
          set -euo pipefail
          probe=$(mktemp "${TMPDIR:-/tmp}/clroom-attestation-contract.XXXXXX")
          output=$(mktemp "${TMPDIR:-/tmp}/clroom-attestation-contract-output.XXXXXX")
          cleanup() {
            rm -f -- "$probe" "$output"
          }
          trap cleanup EXIT HUP INT TERM
          grep -Fv -- 'uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2' .github/workflows/release.yml > "$probe"
          if bash scripts/release/check-attestation-contract.sh "$probe" .github/workflows/release-candidate.yml >"$output" 2>&1; then
            echo "release attestation contract unexpectedly passed without the pinned tag attestation action" >&2
            exit 1
          fi
          grep -Fq 'RELEASE_ATTESTATION_CONTRACT_BLOCKED:TAG_ATTEST_ACTION_PIN' "$output"
      - name: Rehearse current published public route before expensive lanes
        if: env.CLROOM_RELEASE_LIFECYCLE == 'ACTIVE_CANDIDATE'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/release/rehearse-public-route.sh --self-test
          bash scripts/release/rehearse-public-route.sh
      - name: Provision pinned Python supply-chain verifier
        if: env.CLROOM_RELEASE_LIFECYCLE == 'ACTIVE_CANDIDATE'
        shell: bash
        run: |
          set -euo pipefail
          verifier_root="$RUNNER_TEMP/clroom-supply-chain-verifier"
          requirements="$RUNNER_TEMP/clroom-supply-chain-verifier-requirements.txt"
          python3 - <<'PY'
          import sys
          if sys.version_info[:2] != (3, 14):
              raise SystemExit(f"unsupported supply-chain verifier Python: {sys.version_info.major}.{sys.version_info.minor}")
          PY
          cat >"$requirements" <<'REQ'
          attrs==26.1.0 --hash=sha256:c647aa4a12dfbad9333ca4e71fe62ddc36f4e63b2d260a37a8b83d2f043ac309
          jsonschema==4.26.0 --hash=sha256:d489f15263b8d200f8387e64b4c3a75f06629559fb73deb8fdfb525f2dab50ce
          jsonschema-specifications==2025.9.1 --hash=sha256:98802fee3a11ee76ecaca44429fda8a41bff98b00a0f2838151b113f210cc6fe
          referencing==0.37.0 --hash=sha256:381329a9f99628c9069361716891d34ad94af76e461dcb0335825aecc7692231
          rpds-py==2026.6.3 --hash=sha256:d7469697dce35be237db177d42e2a2ee26e6dcc5fc052078a6fefabd288c6edd
          REQ
          python3 -m venv "$verifier_root"
          "$verifier_root/bin/python" -m pip install --disable-pip-version-check --no-input \
            --only-binary=:all: --require-hashes -r "$requirements"
          echo "$verifier_root/bin" >> "$GITHUB_PATH"
          "$verifier_root/bin/python" - <<'PY'
          import importlib.metadata
          expected = {
              "attrs": "26.1.0",
              "jsonschema": "4.26.0",
              "jsonschema-specifications": "2025.9.1",
              "referencing": "0.37.0",
              "rpds-py": "2026.6.3",
          }
          actual = {name: importlib.metadata.version(name) for name in expected}
          if actual != expected:
              raise SystemExit(f"supply-chain verifier closure mismatch: {actual!r}")
          PY
      - name: Install cargo-deny 0.20.2 verification tool
        shell: bash
        run: |
          set -euo pipefail
          asset=""
          expected=""
          case "$(uname -m)" in
            arm64)
              asset="cargo-deny-0.20.2-aarch64-apple-darwin.tar.gz"
              expected="fe67d82a10d8597a3549364cb733a3f9cc1bfff9031b7ae46384a9f2a72090c3"
              ;;
            x86_64)
              asset="cargo-deny-0.20.2-x86_64-apple-darwin.tar.gz"
              expected="248da7f581724e470071990c088ffc55c811981715f4cbdb258621fb79f8b7a6"
              ;;
            *)
              echo "unsupported runner architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          archive="$RUNNER_TEMP/$asset"
          curl --fail --location --silent --show-error --retry 3 \
            --output "$archive" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/$asset"
          actual="$(shasum -a 256 "$archive" | awk '{print $1}')"
          test "$actual" = "$expected"
          tool_root="$RUNNER_TEMP/cargo-deny-0.20.2"
          mkdir -p "$tool_root"
          tar -xzf "$archive" -C "$tool_root"
          tool="$(find "$tool_root" -type f -name cargo-deny -print -quit)"
          test -n "$tool"
          tool_dir="$RUNNER_TEMP/cargo-deny-bin"
          mkdir -p "$tool_dir"
          install -m 0755 "$tool" "$tool_dir/cargo-deny"
          echo "$tool_dir" >> "$GITHUB_PATH"
          test "$("$tool_dir/cargo-deny" --version)" = "cargo-deny 0.20.2"
      - name: Provision pinned real provider canaries
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CLROOM_RELEASE_LIFECYCLE" == "POST_PUBLISH" ]]; then
            echo "PROVIDER_CANARY_SKIPPED lifecycle=POST_PUBLISH"
            exit 0
          fi
          [[ "$CLROOM_RELEASE_LIFECYCLE" == "ACTIVE_CANDIDATE" ]] || {
            echo "invalid release lifecycle: $CLROOM_RELEASE_LIFECYCLE" >&2
            exit 1
          }
          ./scripts/release/provision-provider-canaries.sh "$RUNNER_TEMP/clroom-providers" "$GITHUB_ENV"
          echo "CLROOM_QUALIFICATION_EVIDENCE_DIR=$RUNNER_TEMP/clroom-qualification" >> "$GITHUB_ENV"
      - name: Provision pinned Codex for standalone MCP rehearsal
        if: github.event_name == 'pull_request' && env.CLROOM_RELEASE_LIFECYCLE == 'POST_PUBLISH'
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/release/provision-provider-canaries.sh --codex-only-frozen "$RUNNER_TEMP/clroom-standalone-providers" "$GITHUB_ENV"
      - name: Run canonical fail-closed gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/release/readiness.sh
      - name: Rehearse Codex runtime on exact PR candidate
        if: github.event_name == 'pull_request' && env.CLROOM_RELEASE_LIFECYCLE == 'ACTIVE_CANDIDATE'
        id: codex_rehearsal
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidate_sha="${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD)" = "$candidate_sha"
          evidence_dir="$RUNNER_TEMP/clroom-release-evidence"
          provider_bin="$RUNNER_TEMP/clroom-codex-rehearsal-bin"
          mkdir -p "$evidence_dir" "$provider_bin"
          ln -s "$CLROOM_PROVIDER_CODEX" "$provider_bin/codex"
          PATH="$provider_bin:$PATH" \
          CLROOM_RELEASE_EVIDENCE_DIR="$evidence_dir" \
            bash scripts/release/local-codex-plugin-activation-smoke.sh rehearse \
              --expected-head "$candidate_sha" \
              --fixture-standalone-mcp
          digest="$(python3 - "$CLROOM_RELEASE_VERSION" <<'PY'
          import json, sys
          with open(f"reports/release/v{sys.argv[1]}-review.json", encoding="utf-8") as handle:
              print(json.load(handle)["reviewed_content_digest"])
          PY
          )"
          key="${digest:0:12}"
          evidence="$evidence_dir/codex-rehearse-v${CLROOM_RELEASE_VERSION}-${key}.json"
          test -s "$evidence"
          artifact_name="codex-rehearsal-v${CLROOM_RELEASE_VERSION}-${digest}"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "evidence=$evidence" >> "$GITHUB_OUTPUT"
      - name: Upload Codex pre-merge rehearsal evidence
        if: github.event_name == 'pull_request' && steps.codex_rehearsal.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.codex_rehearsal.outputs.artifact_name }}
          path: ${{ steps.codex_rehearsal.outputs.evidence }}
          if-no-files-found: error
          retention-days: 30
      - name: Rehearse standalone Codex MCP on exact PR candidate
        if: github.event_name == 'pull_request'
        id: codex_standalone_mcp_rehearsal
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD)" = "$candidate_sha"
          cargo build --locked --bin clroom
          evidence_dir="$RUNNER_TEMP/clroom-standalone-mcp-evidence"
          mkdir -p "$evidence_dir"
          evidence="$evidence_dir/codex-standalone-mcp-${candidate_sha}.json"
          python3 scripts/release/rehearse-codex-standalone-mcp.py \
            --candidate "$PWD/target/debug/clroom" \
            --provider "$CLROOM_PROVIDER_CODEX" \
            --source-head "$candidate_sha" \
            --expected-provider-version "$CLROOM_PROVIDER_CODEX_VERSION" \
            --expected-provider-sha256 "$CLROOM_PROVIDER_CODEX_SHA256" \
            --home "$RUNNER_TEMP/clroom-standalone-mcp-home" \
            --output "$evidence"
          test -s "$evidence"
          echo "artifact_name=codex-standalone-mcp-${candidate_sha}" >> "$GITHUB_OUTPUT"
          echo "evidence=$evidence" >> "$GITHUB_OUTPUT"
      - name: Upload standalone Codex MCP rehearsal evidence
        if: github.event_name == 'pull_request' && steps.codex_standalone_mcp_rehearsal.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.codex_standalone_mcp_rehearsal.outputs.artifact_name }}
          path: ${{ steps.codex_standalone_mcp_rehearsal.outputs.evidence }}
          if-no-files-found: error
          retention-days: 30

  pretag-stage:
    name: Rehearse/stage exact release bytes
    needs: [release-eligibility, release-readiness]
    if: needs.release-eligibility.outputs.lifecycle == 'ACTIVE_CANDIDATE' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: macos-14
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Provision pinned real provider canaries
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/release/provision-provider-canaries.sh "$RUNNER_TEMP/clroom-providers" "$GITHUB_ENV"
      - name: Build and qualify exact future shipping bytes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$source_sha"
          bash scripts/release/stage-release.sh "$source_sha" "$RUNNER_TEMP/pretag-stage"
      - name: Upload content-addressed pre-tag stage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pretag-stage-v${{ needs.release-eligibility.outputs.version }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/pretag-stage/*
          if-no-files-found: error
          retention-days: 30

  publishable-content:
    name: Publishable content semantic closure
    needs: [release-eligibility, pretag-stage]
    if: needs.release-eligibility.outputs.lifecycle == 'ACTIVE_CANDIDATE'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download exact staged public surface
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pretag-stage-v${{ needs.release-eligibility.outputs.version }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: pretag-stage
      - name: Verify publishable content semantics
        shell: bash
        run: |
          set -euo pipefail
          source scripts/release/provider-pins.sh
          source_head="${{ github.event.pull_request.head.sha || github.sha }}"
          source_tree="$(git rev-parse "HEAD^{tree}")"
          review_path="reports/release/v${{ needs.release-eligibility.outputs.version }}-review.json"
          review_digest="$(python3 - "$review_path" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1], encoding="utf-8"))["reviewed_content_digest"])
          PY
          )"
          python3 scripts/release/verify-pretag-stage.py \
            --dir pretag-stage \
            --version "${{ needs.release-eligibility.outputs.version }}" \
            --source-head "$source_head" \
            --source-tree "$source_tree" \
            --reviewed-content-digest "$review_digest" \
            --codex-version "$CODEX_VERSION" \
            --claude-version "$CLAUDE_VERSION"
          python3 scripts/release/verify-publishable-surface.py \
            --facts pretag-stage/release-facts.json \
            --preview pretag-stage/publish-preview.json \
            --notes pretag-stage/release-notes.md \
            --evidence pretag-stage/publishable-surface.json
          echo "PUBLISHABLE_CONTENT_SEMANTIC_PASS source=$source_head"

  pretag-attestation-rehearsal:
    name: Rehearse attestation mechanism before tag
    needs: [release-eligibility, release-readiness, pretag-stage, publishable-content]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release-eligibility.outputs.lifecycle == 'ACTIVE_CANDIDATE'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out exact accepted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download exact staged bytes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pretag-stage-v${{ needs.release-eligibility.outputs.version }}-${{ github.sha }}
          path: pretag-stage
      - name: Verify staged manifest
        shell: bash
        run: |
          set -euo pipefail
          source scripts/release/provider-pins.sh
          python3 scripts/release/verify-pretag-stage.py             --dir pretag-stage             --version "${{ needs.release-eligibility.outputs.version }}"             --source-head "$GITHUB_SHA"             --codex-version "$CODEX_VERSION"             --claude-version "$CLAUDE_VERSION"
      - name: Rehearse build provenance attestation
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: pretag-stage/SHA256SUMS
      - name: Rehearse CycloneDX SBOM attestation
        id: sbom_attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: pretag-stage/clean-room-launcher-v${{ needs.release-eligibility.outputs.version }}-aarch64-apple-darwin.tar.gz
          sbom-path: pretag-stage/sbom.cdx.json
      - name: Verify pre-tag attestation mechanism
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release-eligibility.outputs.version }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom_attestation.outputs.bundle-path }}
        shell: bash
        run: |
          set -euo pipefail
          artifact="clean-room-launcher-v${VERSION}-aarch64-apple-darwin.tar.gz"
          for subject in "$artifact" sbom.cdx.json install.sh; do
            gh attestation verify "pretag-stage/$subject"               -R "$GITHUB_REPOSITORY"               --bundle "$PROVENANCE_BUNDLE"               --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-candidate.yml"               --source-digest "$GITHUB_SHA"               --source-ref "refs/heads/main"               --deny-self-hosted-runners
          done
          gh attestation verify "pretag-stage/$artifact"             -R "$GITHUB_REPOSITORY"             --bundle "$SBOM_BUNDLE"             --predicate-type https://cyclonedx.org/bom             --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-candidate.yml"             --source-digest "$GITHUB_SHA"             --source-ref "refs/heads/main"             --deny-self-hosted-runners
          echo "PRETAG_ATTESTATION_REHEARSAL_PASS source=$GITHUB_SHA"

  promotion-prepare-rehearsal:
    name: Promotion prepare rehearsal
    needs: [release-eligibility, release-readiness, pretag-stage, publishable-content, pretag-attestation-rehearsal]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release-eligibility.outputs.lifecycle == 'ACTIVE_CANDIDATE'
    uses: ./.github/workflows/release-promotion-rehearsal.yml
    permissions:
      contents: read
      actions: read

  release-required:
    name: Release required
    needs: [release-eligibility, release-readiness, pretag-stage, publishable-content, pretag-attestation-rehearsal, promotion-prepare-rehearsal]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require complete release-candidate topology
        env:
          EVENT: ${{ github.event_name }}
          LIFECYCLE: ${{ needs.release-eligibility.outputs.lifecycle }}
          ELIGIBILITY: ${{ needs.release-eligibility.result }}
          READINESS: ${{ needs.release-readiness.result }}
          STAGE: ${{ needs.pretag-stage.result }}
          PUBLISHABLE: ${{ needs.publishable-content.result }}
          ATTEST: ${{ needs.pretag-attestation-rehearsal.result }}
          PROMOTION: ${{ needs.promotion-prepare-rehearsal.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$ELIGIBILITY" = success
          case "$LIFECYCLE:$EVENT" in
            ACTIVE_CANDIDATE:pull_request)
              test "$READINESS" = success
              test "$STAGE" = success
              test "$PUBLISHABLE" = success
              test "$ATTEST" = skipped
              test "$PROMOTION" = skipped
              ;;
            ACTIVE_CANDIDATE:push)
              test "$READINESS" = success
              test "$STAGE" = success
              test "$PUBLISHABLE" = success
              test "$ATTEST" = success
              test "$PROMOTION" = success
              ;;
            ACTIVE_CANDIDATE:workflow_dispatch)
              test "$READINESS" = success
              test "$STAGE" = skipped
              test "$PUBLISHABLE" = skipped
              test "$ATTEST" = skipped
              test "$PROMOTION" = skipped
              ;;
            RELEASE_QUARANTINED:*)
              test "$READINESS" = skipped
              test "$STAGE" = skipped
              test "$PUBLISHABLE" = skipped
              test "$ATTEST" = skipped
              test "$PROMOTION" = skipped
              ;;
            POST_PUBLISH:*)
              test "$READINESS" = success
              test "$STAGE" = skipped
              test "$PUBLISHABLE" = skipped
              test "$ATTEST" = skipped
              test "$PROMOTION" = skipped
              ;;
            *)
              echo "unexpected release topology lifecycle=$LIFECYCLE event=$EVENT" >&2
              exit 1
              ;;
          esac
          echo "RELEASE_REQUIRED_PASS lifecycle=$LIFECYCLE event=$EVENT"
