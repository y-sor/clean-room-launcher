name: Public trust watch

on:
  schedule:
    - cron: '17 7 * * *'
    - cron: '37 16 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [CI, Fuzz smoke, Release candidate readiness, CodeQL, OpenSSF Scorecard]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
  pull_request:
    paths:
      - 'scripts/probe/check-public-trust.py'
      - 'scripts/probe/public_trust_ops.py'
      - 'scripts/release/readiness.sh'
      - '.github/workflows/public-trust.yml'
      - '.github/workflows/release-candidate.yml'
      - 'README.md'
      - 'SECURITY.md'

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

concurrency:
  group: public-trust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Public trust audit
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run public trust negative regression fixtures
        run: python3 scripts/probe/check-public-trust.py --self-test
      - name: Validate static public trust contract
        run: python3 scripts/probe/check-public-trust.py --static
      - name: Rehearse exact-candidate live GitHub read path
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/probe/check-public-trust.py --rehearse-live
      - name: Audit live public state and classify repair needed
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/probe/check-public-trust.py --daily --settle-seconds 3120
