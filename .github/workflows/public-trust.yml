name: Public trust watch

on:
  schedule:
    - cron: '17 7 * * *'
    - cron: '37 16 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [CI, Fuzz smoke, Release candidate readiness, CodeQL, OpenSSF Scorecard]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
  pull_request:
    paths:
      - 'scripts/probe/check-public-trust.py'
      - 'scripts/probe/public_trust_ops.py'
      - 'scripts/release/readiness.sh'
      - '.github/workflows/public-trust.yml'
      - '.github/workflows/release-candidate.yml'
      - 'README.md'
      - 'SECURITY.md'

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

concurrency:
  group: public-trust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Public trust audit
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run public trust negative regression fixtures
        run: python3 scripts/probe/check-public-trust.py --self-test
      - name: Validate static public trust contract
        run: python3 scripts/probe/check-public-trust.py --static
      - name: Rehearse exact-candidate live GitHub read path
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          env = dict(os.environ)
          env.pop("GITHUB_SHA", None)  # PR merge SHA is not current default-branch SHA.
          proc = subprocess.run(
              ["python3", "scripts/probe/check-public-trust.py", "--daily", "--settle-seconds", "0"],
              env=env, capture_output=True, text=True, timeout=90, check=False)
          assert proc.returncode in (0, 1), proc.stderr
          result = json.loads(proc.stdout)
          assert result["schema"] == "clroom.public-trust.v2"
          by_name = {row["check"]: row for row in result["checks"]}
          assert by_name["repo-identity"]["state"] == "PASS"
          assert by_name["main-protection-contract"]["state"] == "PASS"
          assert by_name["public-install-assets"]["state"] == "PASS"
          for name in ("CI", "Fuzz smoke", "Release candidate readiness", "CodeQL"):
              row = by_name["main:" + name]
              assert row["evidence"]["run_id"] and row["evidence"]["sha"]
          assert by_name["scorecard-latest"]["evidence"]["run_id"]
          print("PUBLIC_TRUST_LIVE_READ_REHEARSAL_PASS")
          PY
      - name: Audit live public state and classify repair needed
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/probe/check-public-trust.py --daily --settle-seconds 3120
