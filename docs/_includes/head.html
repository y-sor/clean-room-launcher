<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  {%- if site.bing_site_verification -%}
  <meta name="msvalidate.01" content="{{ site.bing_site_verification | escape }}">
  {%- endif -%}
  <meta name="robots" content="max-image-preview:large">
  <link rel="describedby" href="{{ '/llms.txt' | relative_url }}">
  {%- if page.url == '/' -%}
  <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "SoftwareApplication",
      "@id": "{{ site.url }}{{ site.baseurl }}/#clroom-app",
      "name": "Clean Room Launcher (CLROOM)",
      "alternateName": ["CLROOM", "Clean Room Launcher"],
      "description": "Free open-source launcher for repeatable clean/selective Codex and Claude Code sessions on supported macOS Apple Silicon systems.",
      "url": "{{ site.url }}{{ site.baseurl }}/",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "macOS on Apple Silicon",
      "isAccessibleForFree": true,
      "offers": {
        "@type": "Offer",
        "price": 0,
        "priceCurrency": "USD",
        "url": "https://github.com/y-sor/clean-room-launcher/releases/latest"
      },
      "downloadUrl": "https://github.com/y-sor/clean-room-launcher/releases/latest",
      "softwareHelp": "{{ site.url }}{{ site.baseurl }}/support/",
      "sameAs": [
        "https://github.com/y-sor/clean-room-launcher"
      ]
    },
    {
      "@type": "SoftwareSourceCode",
      "@id": "{{ site.url }}{{ site.baseurl }}/#clroom-source",
      "name": "Clean Room Launcher (CLROOM) source code",
      "description": "Rust source code for the Clean Room Launcher (CLROOM) project.",
      "url": "https://github.com/y-sor/clean-room-launcher",
      "codeRepository": "https://github.com/y-sor/clean-room-launcher",
      "programmingLanguage": "Rust",
      "runtimePlatform": "macOS on Apple Silicon",
      "license": "https://www.mozilla.org/MPL/2.0/",
      "targetProduct": {
        "@id": "{{ site.url }}{{ site.baseurl }}/#clroom-app"
      }
    }
  ]
}
</script>
  {%- endif -%}
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
  {%- feed_meta -%}
  <link rel="icon" href="{{ '/assets/brand/favicon.ico' | relative_url }}" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/brand/favicon-32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/brand/favicon-16.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/brand/apple-touch-icon.png' | relative_url }}">
  <meta name="theme-color" content="#111820">
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}
</head>
